<nav class="navbar navbar-expand-lg ev-nav">
  <div class="container">
    <a class="navbar-brand ev-brand" routerLink="/cliente/eventos">Eventra</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Abrir menú">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav me-auto">
        @for (g of grupos; track g.nombre) {
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">{{ g.nombre }}</a>
            <ul class="dropdown-menu">
              @for (e of g.enlaces; track e.ruta) {
                <li><a class="dropdown-item" [routerLink]="e.ruta" routerLinkActive="active">{{ e.texto }}</a></li>
              }
            </ul>
          </li>
        }
      </ul>
      <button type="button" class="btn btn-sm btn-outline-light me-2 theme-toggle" (click)="tema.alternar()"
        [attr.aria-label]="tema.tema === 'dark' ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
        [title]="tema.tema === 'dark' ? 'Modo claro' : 'Modo oscuro'">
        @if (tema.tema === 'dark') {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        }
      </button>
      <a class="btn btn-sm btn-outline-light me-2" routerLink="/auth/login">Iniciar sesión</a>
      <a class="btn btn-sm btn-accent" routerLink="/auth/registro">Registrarse</a>
    </div>
  </div>
</nav>
