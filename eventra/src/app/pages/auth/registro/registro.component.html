<section class="auth-box ev-card">
  <h1 class="ev-title">Crea tu cuenta</h1>
  <p class="ev-sub">Regístrate en pocos pasos.</p>
  <div class="mb-3"><label class="form-label">Nombre completo</label><input class="form-control"></div>
  <div class="mb-3"><label class="form-label">Correo electrónico</label><input type="email" class="form-control"></div>
  <div class="mb-3"><label class="form-label">Tipo de cuenta</label>
    <select class="form-select">@for (r of roles; track r) { <option>{{ r }}</option> }</select></div>
  <div class="mb-3"><label class="form-label">Contraseña</label><input type="password" class="form-control"></div>
  <a class="btn btn-primary w-100" routerLink="/auth/login">Registrarme</a>
  <p class="mt-3 mb-0 text-center">¿Ya tienes cuenta? <a routerLink="/auth/login">Inicia sesión</a></p>
</section>
