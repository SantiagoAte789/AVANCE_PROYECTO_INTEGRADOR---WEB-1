<section class="auth-box ev-card">
  <h1 class="ev-title">Inicia sesión</h1>
  <p class="ev-sub">Entra a Eventra para reservar o gestionar tus eventos.</p>
  <div class="mb-3"><label class="form-label">Correo electrónico</label>
    <input type="email" class="form-control" [value]="usuario.email"></div>
  <div class="mb-3"><label class="form-label">Contraseña</label>
    <input type="password" class="form-control" value="123456"></div>
  <a class="btn btn-primary w-100" routerLink="/cliente/eventos">Entrar</a>
  <p class="mt-3 mb-0 text-center">¿No tienes cuenta? <a routerLink="/auth/registro">Crea una cuenta</a></p>
</section>
